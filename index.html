<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Montserrat:wght@500&display=swap" rel="stylesheet">
        <link href="styles.css" rel="stylesheet">
        <title>RSA History Quiz</title>
        <script src="script.js" defer></script>
    </head>
    <body>
        <main class="card">
            <header class="card-header">
                <h1>The Road to 1994</h1>
                <span class="progress-label" id="progress-label"></span>
            </header>

            <div class="progress" role="progressbar" aria-valuemin="0" aria-valuenow="1" aria-label="Quiz progress" id="progress">
                <div class="progress-fill" id="progress-fill"></div>
            </div>

            <!-- Questions are built by script.js from the list at the top of that file -->
            <section class="question" id="question-area"></section>

            <section class="results" id="results" hidden>
                <p class="score" id="score"></p>
                <p class="score-note" id="score-note"></p>
                <button class="restart" type="button">Try again</button>
            </section>
        </main>
    </body>
</html>
